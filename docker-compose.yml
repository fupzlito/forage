services:
  forage:
    build: .
    image: fupzlito/forage:latest
    container_name: forage
    restart: always
    ports:
      - "3672:3672"            # expose port 3672 (or use "127.0.0.1:3672:3672" for localhost-only)
    environment:
      - TZ=America/New_York
      - FORAGE_AUTH_ENABLED=false              # set to true to require Bearer API keys
      - FORAGE_API_KEYS=your_api_key_here      # comma-separated keys when auth is enabled
      - FORAGE_REQUIRE_MAX_CHARS=false         # require LLMs to budget token limits per URL
      - FORAGE_SEARXNG_URL=http://searxng:8080 # SearXNG metasearch instance
    volumes:
      # Optional: mount directory containing config.yaml / prompts.yaml:
      # - ./config:/etc/forage:ro
      # OR mount individual config file:
      - ./config.yaml:/etc/forage/config.yaml:ro
    networks:
      - searxng_default          # talk to SearXNG by service name (searxng:8080)
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3672/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# SearXNG must run on this shared network so Forage can call it as searxng:8080.
# See docs/SEARXNG.md. If your SearXNG compose uses another project name,
# adjust the network name (and FORAGE_SEARXNG_URL) accordingly.
networks:
  searxng_default:
    external: true
